<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#0d0d10" />
      <stop offset="100%" stop-color="#180407" />
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#7f1d1d" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.045" />
    </pattern>
    <pattern id="majorGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)" />
  <rect width="1600" height="500" fill="url(#glow)" />
  <rect width="1600" height="500" fill="url(#grid)" />
  <rect width="1600" height="500" fill="url(#majorGrid)" />

  <!-- Architectural Horizon & Calibration Marks -->
  <line x1="0" y1="250" x2="1600" y2="250" stroke="#dc2626" stroke-width="1" stroke-opacity="0.28" />
  <line x1="1150" y1="0" x2="1150" y2="500" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.08" stroke-dasharray="4 6" />

  <!-- Precision Studio Metering Bars (Right Side) -->
  <g transform="translate(1180, 120)" opacity="0.65">
    <rect x="0" y="90" width="4" height="80" fill="#dc2626" rx="2" />
    <rect x="14" y="50" width="4" height="160" fill="#ef4444" rx="2" />
    <rect x="28" y="20" width="4" height="220" fill="#dc2626" rx="2" />
    <rect x="42" y="70" width="4" height="120" fill="#991b1b" rx="2" />
    <rect x="56" y="40" width="4" height="180" fill="#ef4444" rx="2" />
    <rect x="70" y="85" width="4" height="90" fill="#7f1d1d" rx="2" />
    <rect x="84" y="15" width="4" height="230" fill="#dc2626" rx="2" />
    <rect x="98" y="60" width="4" height="140" fill="#b91c1c" rx="2" />
    <rect x="112" y="95" width="4" height="70" fill="#7f1d1d" rx="2" />
    <rect x="126" y="45" width="4" height="170" fill="#ef4444" rx="2" />
    <rect x="140" y="75" width="4" height="110" fill="#991b1b" rx="2" />
    <rect x="154" y="105" width="4" height="50" fill="#7f1d1d" rx="2" />
  </g>

  <!-- Minimalist Technical Typography -->
  <g fill="#a3a3a3" font-family="monospace" font-size="11" letter-spacing="3" opacity="0.55">
    <text x="60" y="52">RED RECORDINGS // MASTERING CONSOLE 01</text>
    <text x="60" y="460">24-BIT / 96KHZ LOSSLESS ARCHITECTURE</text>
    <text x="1340" y="52">0.0 dBFS // PEAK</text>
    <text x="1340" y="460">SLEEPYRED999 STUDIO</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 40 70 L 40 35 L 75 35" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.5" />
  <path d="M 1560 70 L 1560 35 L 1525 35" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.5" />
  <path d="M 40 430 L 40 465 L 75 465" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.5" />
  <path d="M 1560 430 L 1560 465 L 1525 465" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.5" />
</svg>
