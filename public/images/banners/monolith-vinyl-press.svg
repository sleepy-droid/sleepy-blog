<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500">
  <defs>
    <linearGradient id="monoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#141417" />
    </linearGradient>
    <radialGradient id="vinylGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#991b1b" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#monoBg)" />

  <!-- Architectural Concentric Vinyl Grooves (Right-Center Focal Point) -->
  <g transform="translate(1050, 250)">
    <circle r="380" fill="url(#vinylGlow)" />
    <circle r="340" fill="none" stroke="#262626" stroke-width="1" />
    <circle r="300" fill="none" stroke="#262626" stroke-width="0.75" />
    <circle r="260" fill="none" stroke="#dc2626" stroke-width="0.75" stroke-opacity="0.35" />
    <circle r="220" fill="none" stroke="#262626" stroke-width="1" />
    <circle r="180" fill="none" stroke="#262626" stroke-width="0.75" />
    <circle r="140" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-opacity="0.5" />
    <circle r="95" fill="#170507" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7" />
    <circle r="22" fill="#0a0a0a" stroke="#525252" stroke-width="1.5" />
  </g>

  <!-- Minimalist Editorial Spec Lines -->
  <g stroke="#262626" stroke-width="1">
    <line x1="70" y1="80" x2="520" y2="80" />
    <line x1="70" y1="420" x2="520" y2="420" />
  </g>
  <g fill="#737373" font-family="monospace" font-size="11" letter-spacing="3">
    <text x="70" y="65">DIRECT-TO-MASTER // EDITION</text>
    <text x="70" y="445">RED RECORDINGS ARCHIVE</text>
  </g>
</svg>
